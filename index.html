<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

    <div class="search">
        <input type="text" id="cityInput" placeholder="Search city">
        <button onclick="getWeather()">🔍</button>
    </div>

    <div class="current-weather" id="currentWeather">
        <!-- Current weather -->
    </div>

    <div class="hourly" id="hourly">
        <!-- Hourly forecast -->
    </div>

    <div class="forecast" id="forecast">
        <!-- Daily forecast -->
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
